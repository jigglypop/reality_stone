[package]
name = "reality_stone"
version = "0.2.10"
edition = "2021"
authors = ["jigglypop <donghwanyeom@gmail.com>"]
description = "High-performance hyperbolic neural networks library powered by Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jigglypop/reality_stone"
documentation = "https://github.com/jigglypop/reality_stone"
homepage = "https://github.com/jigglypop/reality_stone"
keywords = [
    "hyperbolic",
    "neural-networks",
    "deep-learning",
    "manifold-learning",
    "riemannian",
]
categories = ["science", "mathematics", "algorithms"]
exclude = [
    "experiments/**",
    "scripts/**",
    "docs/**",
    "examples/**",
    "tests/**",
    "*.md",
    ".git/**",
    ".github/**",
]

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
ndarray = { version = "0.15", features = ["rayon", "approx"] }
numpy = "0.21.0"
rayon = "1.8.0"
indicatif = "0.17"
num-traits = "0.2"
num-integer = "0.1"
num-rational = "0.4"
simba = "0.8"
approx = "0.4.0"
anyhow = "1.0"
thiserror = "1.0"
ndarray-rand = "0.15.0"
rand = "0.8.5"
libc = "0.2"
rustfft = "6.4.0"
faer = "0.19"

[build-dependencies]
cc = "1.0"
glob = "0.3"
bindgen = { version = "0.69", optional = true }

[features]
default = []
cuda = ["bindgen"]
abi3-py310 = ["pyo3/abi3-py310"]
