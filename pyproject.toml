[build-system]
requires = ["setuptools>=77,<82", "setuptools-rust>=1.10,<2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reality_stone"
version = "0.3.0"
description = "Geometry operators and the experimental Clarus runtime with native acceleration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [{name = "jigglypop", email = "donghwanyeom@gmail.com"}]
dependencies = ["numpy>=1.24,<3", "torch>=2.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/jigglypop/reality_stone"
Issues = "https://github.com/jigglypop/reality_stone/issues"

[project.optional-dependencies]
llm = ["tokenizers>=0.15,<1", "transformers>=4.40,<6", "tqdm>=4.66,<5"]
science = ["datasets>=2.18,<5", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0", "seaborn>=0.13", "joblib>=1.3", "sympy>=1.12"]
vision = ["torchvision>=0.15"]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14", "qiskit-ibm-runtime>=0.20"]
neuro = ["nibabel>=5.4"]
dev = ["pytest>=7", "build>=1.2", "twine>=6", "ruff>=0.4"]
all = ["reality_stone[llm,science,vision,quantum,neuro,dev]==0.3.0"]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["reality_stone", "reality_stone.*"]
exclude = ["reality_stone.clarus.core", "reality_stone.clarus.core.*"]
namespaces = false

[[tool.setuptools-rust.ext-modules]]
target = "reality_stone._rust"
path = "Cargo.toml"
binding = "PyO3"
args = ["--locked"]

[[tool.setuptools-rust.ext-modules]]
target = "reality_stone.clarus._rust"
path = "python/reality_stone/clarus/core/Cargo.toml"
binding = "PyO3"
features = ["python"]
args = ["--locked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires CUDA kernels", "network: requires external model/data downloads"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest>=7"]
test-command = "python {project}/tools/verify_installed.py --native && python {project}/tools/verify_installed.py --fallback && pytest -q -p no:cacheprovider {project}/tests/test_native_gradients.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = {PATH = "$HOME/.cargo/bin:$PATH"}
before-test = "pip install torch --index-url https://download.pytorch.org/whl/cpu"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-test = "pip install torch --index-url https://download.pytorch.org/whl/cpu"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-test = "pip install torch"
